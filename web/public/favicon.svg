<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- 背景：深靛蓝圆角方形 -->
  <rect width="48" height="48" rx="10" fill="#0F172A"/>
  <rect width="48" height="48" rx="10" fill="url(#bg-gradient)"/>

  <!-- 时钟外圈 -->
  <circle cx="24" cy="20" r="12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- 时钟指针：12点方向（金色） -->
  <line x1="24" y1="20" x2="24" y2="13" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <!-- 时钟指针：3点方向（白色） -->
  <line x1="24" y1="20" x2="30" y2="20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- 中心点 -->
  <circle cx="24" cy="20" r="1.5" fill="#F59E0B"/>

  <!-- 底部账单线条 -->
  <line x1="16" y1="37" x2="32" y2="37" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="16" y1="41" x2="28" y2="41" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
</svg>
