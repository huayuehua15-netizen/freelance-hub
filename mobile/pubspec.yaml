name: freelance_hub
description: Freelance Hub - Time tracking, expense management and tax summary for freelancers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # 状态管理
  provider: ^6.1.2
  # 本地数据库
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  # 收据图片
  image_picker: ^1.1.2
  # 订阅支付
  purchases_flutter: ^8.1.0
  # 网络
  dio: ^5.4.3+1
  # PDF
  pdf: ^3.10.8
  printing: ^5.12.0
  # 图表
  fl_chart: ^0.68.0
  # 后台任务
  workmanager: ^0.10.7
  # 通知
  flutter_local_notifications: ^17.2.2
  # 工具
  intl: ^0.20.3
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
